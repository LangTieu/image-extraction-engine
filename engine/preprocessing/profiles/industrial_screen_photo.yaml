# Photographed screens and industrial HMI panels: glare, perspective, noise.
name: industrial_screen_photo
steps:
  # 0/180 detection is off: normalize_screen already rectifies the panel, and
  # the detector's centroid tie-break assumes top-anchored content, which HMI
  # layouts (legend/status rows at the bottom) violate — an upright panel was
  # being flipped 180° and every OCR string came back mirrored (regressed the
  # coil_table seed set to NO_PROFILE_MATCHED). Small-angle deskew stays on.
  orientation:
    detect: false
    deskew: true
    max_correction_angle: 10.0
  perspective:
    enabled: true
    min_area_fraction: 0.25
  denoise:
    method: fastnlmeans
    strength: 7
    require_quality_flag: true
  contrast:
    clip_limit: 2.5
    tile_grid_size: 8
    gamma: 1.1
    require_quality_flag: true
  sharpen:
    strength: 0.8
    radius: 3
