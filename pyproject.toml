[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-extraction-engine"
version = "0.0.1"
description = "Modular Hybrid Vision Engine: general document and industrial vision extraction."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "pypdfium2>=4.25",
    "pyyaml>=6.0",
    "rapidocr-onnxruntime>=1.3",
    "openpyxl>=3.1",
    "jsonschema>=4.20",
    "reportlab>=4.0",
    "pytesseract>=0.3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "jiwer>=3.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
include = ["engine*", "service*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["yaml", "pypdfium2", "pytesseract", "paddleocr", "paddlex", "huggingface_hub", "transformers", "torch", "docling", "docling.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.comments", "openpyxl.styles", "openpyxl.utils", "jsonschema", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
