name: Deploy API image (P7)

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - "engine/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Serialize deploys: two rapid pushes must not race on port 8000 (review #8b).
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: [self-hosted, lv3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -e ".[dev]" || python -m pip install -e .

      - name: Run tests
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q
  build-push:
    needs: test
    runs-on: [self-hosted, lv3]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-stage: node builds service/web (React UI), python runtime with
      # Tesseract vie+eng serves API + UI.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/langtieu/image-extraction-engine:latest
            ghcr.io/langtieu/image-extraction-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: [self-hosted, lv3]
    steps:
      - uses: actions/checkout@v4
      # Deploy the image build-push published (review #8c) instead of building
      # again: pull the sha-tagged GHCR image and run it via compose.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the published image
        run: docker pull ghcr.io/langtieu/image-extraction-engine:${{ github.sha }}
      - name: Deploy with docker compose
        run: IMAGE_TAG=${{ github.sha }} docker compose up -d --no-build

      - name: Smoke test /v1/health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/v1/health; then
              echo "health check passed"
              exit 0
            fi
            echo "attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "health check failed after 30 attempts"
          docker compose logs --tail 100
          exit 1
