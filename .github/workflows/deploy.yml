name: Deploy API image (P7)

on:
  push:
    branches: [main]
    paths: ["service/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: [self-hosted, lv3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]" || python -m pip install -e .

      - name: Run tests
        run: python -m pytest tests/ -q

  build-push:
    needs: test
    runs-on: [self-hosted, lv3]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-stage: node builds service/web (React UI), python runtime with
      # Tesseract vie+eng serves API + UI.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/langtieu/image-extraction-engine:latest
            ghcr.io/langtieu/image-extraction-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: [self-hosted, lv3]
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml builds from the repo checkout (build: .), so no GHCR pull is needed;
      # build-push above keeps the GHCR image as an artifact.
      - name: Deploy with docker compose
        run: docker compose up -d --build

      - name: Smoke test /v1/health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/v1/health; then
              echo "health check passed"
              exit 0
            fi
            echo "attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "health check failed after 30 attempts"
          exit 1
