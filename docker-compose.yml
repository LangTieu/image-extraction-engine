# Local stack: API + web UI on one container (SQLite, in-process worker).
# Scaling out: SERVICE_WORKER_MODE=rq + SERVICE_REDIS_URL + Postgres
# SERVICE_DB_URL, then run the same image as `rq worker-pool iee`.
services:
  api:
    image: ghcr.io/langtieu/image-extraction-engine:${IMAGE_TAG:-latest}
    build: .
    ports:
      - "8000:8000"
    environment:
      SERVICE_PROFILE: industrial
      SERVICE_MAX_UPLOAD_MB: "20"
      SERVICE_RATE_LIMIT_PER_MINUTE: "60"
      # API-key gate (Henrry): set the key in the repo's Actions secrets
      # (Settings > Secrets and variables > Actions > IMAGE_ENGINE_API_KEY);
      # the same value goes into the web UI's unlock screen.
      IMAGE_ENGINE_API_KEY: ${IMAGE_ENGINE_API_KEY:?set IMAGE_ENGINE_API_KEY in the environment (or .env)}
    volumes:
      - iee-data:/app/service/data
  # Optional profile: docker compose --profile redis up
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
volumes:
  iee-data:
